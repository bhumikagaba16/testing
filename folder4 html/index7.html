<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            padding: 23px;
            border:2px solid black;
            /* box shadow: h-offset v-offset blur spread color inset  */
            box-shadow: 5px 5px 15px #288013;
            /* text shadow: h-offset v-offset blur color  */
            text-shadow: 5px 5px 15px #8122da;
            /* outline: width style color */
            outline: 2px solid yellow;
        }
        .box1{
            padding: 45px;
            border: 2px dotted red;
            text-shadow: 5px 5px 15px #ff0000;
             outline: 2px solid blueviolet;
             outline-offset: 5px;
             border-radius: 65px;
        }
    </style>
</head>
<body>
    <div class="box">
        this is a box
    </div>
    <p class="box1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Iure voluptate voluptatum molestiae ut officia assumenda nostrum suscipit quidem. Eveniet deleniti quas quod non!</p>
</body>
</html>
