<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS list styling</title>
    <style>
        nav ul li {
            /* padding: 23px;
            display: flex; */
            list-style: none;
            background-color: yellow;
             border: 2px solid black;
        }

        .box ul li {
            list-style-position: inside;
            background-color: yellow;
            border: 2px solid black;
            /* list-style-image: url("https://sp.yimg.com/ib/th?&id=ODL.3bad9443ece7bfc0b7cc10bbf2adb07e&w=116&h=146&c=4&rs=1"); */
            /* list-style-type: "🦋"; */
        }

        .box1 ul li {
            background-color: yellow;
            border: 2px solid black;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </nav>
    <div class="box1">
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </div>
    <div class="box">
        <ul>
            <li>home</li>
            <li>about</li>
            <li>contact</li>
        </ul>
    </div>
</body>

</html>
