<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <style>
        .abc {
            color: red;
        }

        .bcd {
            color: #00077a;
        }

        .cde {
            color: rgb(99, 8, 151);
        }

        .def {
            color: rgba(65, 76, 98, 0.925);
        }

        .efg {
            color: hsl(65, 92%, 47%);
        }
    </style>
</head>

<body>
    <h1>colours of fonts</h1>
    <p>
        types of color
    <ol>
        <li class="abc"><b>color keyword </b><span>- this is color keywords</span></li>
        <li class="bcd"><b>hex color code </b><span>- this is hex color code</span></li>
        <li class="cde"><b>RBG </b><span>- this is rgb color</span></li>
        <li class="def"><b>RBGS </b><span>- this is rbga colo</span></li>
        <li class="efg"><b>HLS </b><span>- this is hsl color</span></li>
    </ol>
