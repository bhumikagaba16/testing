<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS styling</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
    }
    .box{
        background-color: aqua;
    }
    .box1{
        padding: 10px;
        margin: 25px;
        border: 2px solid blue;
        height: 200px;
        box-sizing: border-box;
        color: yellow;
    }
    .box2{
        color: red;
         padding: 10px;
        margin: 25px;
        border: 2px solid black;
        height: 200px;
        box-sizing: border-box;
    }
</style>
<body>
    <div class="box box1">
        this is first
    </div>
    <div class="box box2">
        this is second
    </div>
</body>
</html>
