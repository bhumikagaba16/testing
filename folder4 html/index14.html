<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid CSS</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            /* grid divided into two coloumn:- */
            grid-template-columns: 100px 120px;
            grid-template-rows: 100px 100px 100px;
            /* this is for column center */
            justify-items: center;
            /* this is for row */
            align-items: center;
            
        }

        .items {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }

        .item-4 {
            grid-row: 1/2;
            grid-column: 1/2;
        }

        .item-2 {
            /* grid-row: 1/2; */

            /* grid-row-start: 1;
            grid-row-end: 2;
            grid-column: 1/2; */
        }

        /*  grid-row: 1/2; we can do this or can write this also
        grid-row-start:1 ;
        grid-row-end:2;*/
    </style>
</head>

<body>
    <div class="container">
        <div class="items">1</div>
        <div class="items item-2">2</div>
        <div class="items">3</div>
        <div class="items item-4">4</div>
        <div class="items">5</div>
    </div>
</body>

</html>
