<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* div{
            background-color: bisque;
        } */

        /* class selector */
        .red{
            
            background-color: red;
            color: white;
        }

        /* id selector */
        #blue{
            background-color: yellow;
            color: red;
        }
        /* child selector */
        div > p{
            background-color: brown;
            color: beige;
        }

        /* desendent selector */
        div p{
            background-color: brown;
            color: bisque;
        }
        /* universal selector */
        *{
            margin: 0;
            padding: 0;
        }
        /* pseudo selector */
        a:visited{
            color: brown;
        }
        a:link{
            color: green;
        }
        a:active{
            background-color: red;
        }
        a:hover{
            background-color: yellow;
        }

        p:first-child{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <main class="one">
        <p>i am first</p>
        <p>i am second</p>
    </main>
    <div class="red">
        this is div tag
    </div>
    <div id="blue">
        this is div tag second
        <article>
            <p>para inside second div</p>
        </article>
    </div>
    <div class="red">
        this is div tag third
        <p>this is paragraph inside the div</p>
    </div>
    <a href="https://www.google.com" target="_blank">Visit to google</a>
    <a href="https://www.youtube.com/watch?v=1cEG1T8beO4" target="_blank">Visit to CWH</a>
</body>
</html>
