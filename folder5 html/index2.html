<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav-Bar</title>
    <style>
        .logo {
        
            /* background-color: blue; */
        }
        .logo img{
            width: 164px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .right ul {
            display: flex;
            gap: 32px;
        }

        .right ul li {
            list-style: none;
        }
        .right ul li img{
            width: 19px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="">
            </div>
            <div class="right">
                <ul>
                    <li>Product</li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>About Us</li>
                    <li><img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Background-2-1.svg" alt=""></li>
                </ul>
            </div>
        </nav>
    </header>
</body>

</html>
