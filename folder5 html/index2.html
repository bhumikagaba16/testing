<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav-Bar</title>
    <style>
        .logo img {
            width: 164px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            cursor: pointer;
        }

        .right ul {
            display: flex;
            gap: 32px;
        }

        .right ul li {
            list-style: none;
            display: flex;
            align-items: center;
            padding: 0px 1px;
        }

        .right ul li img {
            width: 19px;
            position: fixed;
            top: 20px;
            right: 200px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="">
            </div>
            <div class="right">
                <ul>
                    <li> <span>Product</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                            height="18" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                        </svg></li>
                    <li> <span>Pricing</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                            height="18" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                        </svg></li>
                    <li> <span>Resources</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                            height="18" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                        </svg></li>
                    <li> <span>About Us</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                            height="18" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                        </svg></li>
                    <li><img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Background-2-1.svg" alt=""></li>
                </ul>
            </div>
        </nav>
    </header>
</body>

</html>
