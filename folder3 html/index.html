<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form -bhumika</title>
</head>

<body>
    <div>
        <form action="post">
            <label for="Username">Username</label>
            <input type="text" id="Username" name="username" placeholder="Enter your Username">
        </form>
    </div>
    <div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
    </div>
    <div>
        <input type="checkbox" name="subscribe" id="subscribe" value="yes">
        <label for="subscribe">SUBSCRIBE the Channel</label>
    </div>
    <div>
        <label for="comment">Enter your Comment here</label><br>
        <textarea rows="5" cols="50" name="comment" id="comment" placeholder="Enter here..."></textarea>

    </div>
    <div>
        <label for="fruits">Select the Fruit</label>
        <select name="fruits" id="fruits">
            <option value="apple">Apple</option>
            <option value="kiwi">Kiwi</option>
            <option value="mango">Mango</option>
        </select>
    </div>
</body>

</html>
